<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Tracker</title>
<style>
body{font-family:system-ui,sans-serif;max-width:480px;margin:40px auto;padding:0 16px;background:#f4f5f7}
h1{text-align:center}
form{display:flex;gap:8px}
input{flex:1;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px}
button{padding:12px 16px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-size:16px}
li{display:flex;justify-content:space-between;align-items:center;background:#fff;margin:8px 0;padding:12px;border-radius:8px;list-style:none}
li.done span{text-decoration:line-through;color:#888}
ul{padding:0}
.del{background:#ef4444;padding:6px 10px}
</style></head><body>
<h1>Task Tracker</h1>
<form id="f"><input id="t" placeholder="Add a task" required><button>Add</button></form>
<ul id="list"></ul>
<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
const list = document.getElementById("list");
function save(){ localStorage.setItem("tasks", JSON.stringify(tasks)); render(); }
function render(){
  list.innerHTML = "";
  tasks.forEach((task, i) => {
    const li = document.createElement("li");
    if (task.done) li.className = "done";
    const s = document.createElement("span");
    s.textContent = task.text;
    s.onclick = () => { tasks[i].done = !tasks[i].done; save(); };
    const d = document.createElement("button");
    d.textContent = "Delete"; d.className = "del";
    d.onclick = () => { tasks.splice(i, 1); save(); };
    li.append(s, d); list.append(li);
  });
}
document.getElementById("f").onsubmit = e => {
  e.preventDefault();
  const t = document.getElementById("t");
  tasks.push({ text: t.value.trim(), done: false });
  t.value = ""; save();
};
render();
</script></body></html>
